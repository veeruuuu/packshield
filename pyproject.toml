[project]
name = "packshield"
version = "0.0.1"
description = "Developer Package Shield — install-lifecycle security shim for npm/pip"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
packshield = "packshield.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packshield*"]

